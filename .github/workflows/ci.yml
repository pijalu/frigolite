name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Install linters
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
        go install github.com/uudashr/gocognit/cmd/gocognit@v1.2.1
        go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0

    - name: Build all packages
      run: go build ./...

    - name: go vet
      run: go vet ./...

    - name: staticcheck
      run: staticcheck ./...

    - name: Complexity debt ratchet
      run: tools/check_complexity_debt.sh

  fast-tests:
    name: Fast Native Pins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: SOLID architecture checks
      run: go test -timeout 10m -run '^TestSOLID_' ./...

    - name: Cross-engine and coercion pins
      run: |
        go test -count=1 -run \
          '^(TestCrossEngineFileMatrix|TestS66SQLiteFileCompatibility|TestCoreFuncBlobCoercion|TestCoreFuncTextPrefix|TestSumBlobCoercion)$' .

  native-race:
    name: Native Race Shards
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Native race tests (10 shards)
      run: tools/run_native_race_shards.sh

  harness-race:
    name: Race JSON Harness (group ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 0
            offset: 0
          - group: 1
            offset: 6
    env:
      FRIGOLITE_SHARD_OFFSET: ${{ matrix.offset }}
      FRIGOLITE_SHARD_TOTAL: '12'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Race JSON harness (6 of 12 shards)
      id: harness
      env:
        FRIGOLITE_SHARD_TIMEOUT: 120m
        FRIGOLITE_SHARD_PARALLEL: 3
      run: |
        mkdir -p "$RUNNER_TEMP/frigolite-race" "artifacts/harness-race-${{ matrix.group }}"
        go test -c -race -o "$RUNNER_TEMP/frigolite-race/frigolite.test" .
        set +e
        bash tools/run_json_shards.sh "$RUNNER_TEMP/frigolite-race/frigolite.test" 6 \
          2>&1 | tee "$RUNNER_TEMP/frigolite-race/harness.log"
        runner_status=${PIPESTATUS[0]}
        set -e
        echo "runner status=$runner_status (known baseline leaves are expected)"
        run_dir=$(sed -n 's/^run_dir=//p' "$RUNNER_TEMP/frigolite-race/harness.log" | tail -n 1)
        cp "$RUNNER_TEMP/frigolite-race/harness.log" "artifacts/harness-race-${{ matrix.group }}/harness.log"
        if [ -n "$run_dir" ]; then
          cp "$run_dir"/shard-*.log "artifacts/harness-race-${{ matrix.group }}/" || true
        fi
        echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"
        tools/check_harness_leaves.sh "$run_dir"

    - name: Upload harness logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: harness-race-logs-${{ matrix.group }}-${{ github.run_id }}
        path: artifacts/harness-race-${{ matrix.group }}/*
        if-no-files-found: warn
        retention-days: 7

  coverage:
    name: Sharded Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FRIGOLITE_SHARD_TIMEOUT: 120m
      FRIGOLITE_SHARD_PARALLEL: 3
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Test coverage (sharded)
      run: tools/run_coverage_gate.sh

  ci-gates:
    name: CI Gates Complete
    runs-on: ubuntu-latest
    needs: [lint, fast-tests, native-race, harness-race, coverage]
    steps:
    - name: Record gate completion
      run: echo "All CI gates passed"

  profile-full-suite:
    name: Profile Full Go Test Suite
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GO_TEST_TIMEOUT: 60m
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Run and summarize full suite
      run: tools/profile-go-test.sh artifacts/go-test-profile.jsonl

    - name: Upload full-suite test events
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: go-test-profile-${{ github.run_id }}
        path: artifacts/go-test-profile.jsonl
        if-no-files-found: warn
        retention-days: 14

  build-cli:
    name: Build CLI Binaries
    runs-on: ubuntu-latest
    needs: [lint, fast-tests]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
      run: |
        mkdir -p build
        ext=""
        if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
        cd cmd/frigolite
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -ldflags="-s -w" \
          -o "../../build/frigolite-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" .
        ls -lh "../../build/frigolite-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: frigolite-${{ matrix.goos }}-${{ matrix.goarch }}
        path: build/frigolite-${{ matrix.goos }}-${{ matrix.goarch }}*
        if-no-files-found: error

  compat-test:
    name: SQLite Compatibility
    runs-on: ubuntu-latest
    needs: [lint, fast-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Install sqlite3
      run: sudo apt-get update && sudo apt-get install -y sqlite3

    - name: Run compatibility tests
      run: go test -v -timeout 60s -run "^TestCompat" ./...

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ci-gates, build-cli, compat-test]

    steps:
    - name: Download all built binaries
      uses: actions/download-artifact@v4
      with:
        pattern: frigolite-*
        path: build/
        merge-multiple: true

    - name: List artifacts
      run: ls -lh build/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/*
        generate_release_notes: true
