name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality-and-test:
    name: Quality Gates + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        # go.mod requires Go 1.24 (t.Chdir); older legs only trigger the Go
        # toolchain auto-download and do not test a supported version.
        go-version: ['1.24']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Install linters
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
        go install github.com/uudashr/gocognit/cmd/gocognit@v1.2.1
        go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0

    - name: Build all packages
      run: go build ./...

    - name: go vet
      run: go vet ./...

    - name: staticcheck
      run: staticcheck ./...

    - name: Complexity debt ratchet
      run: tools/check_complexity_debt.sh

    - name: Native race tests (10 shards)
      # One go test process over all native tests exceeds the 30m go-test
      # timeout on CI runners. Shard by test-name prefix, separating the long
      # Btree churn tests; the JSON harness has its own 12-shard race step.
      run: tools/run_native_race_shards.sh

    - name: Race JSON harness (12 shards)
      env:
        FRIGOLITE_SHARD_TIMEOUT: 120m
        FRIGOLITE_SHARD_PARALLEL: 6
      run: |
        mkdir -p "$RUNNER_TEMP/frigolite-race"
        go test -c -race -o "$RUNNER_TEMP/frigolite-race/frigolite.test" .
        set +e
        bash tools/run_json_shards.sh "$RUNNER_TEMP/frigolite-race/frigolite.test" 12 \
          2>&1 | tee "$RUNNER_TEMP/frigolite-race/harness.log"
        runner_status=${PIPESTATUS[0]}
        set -e
        echo "runner status=$runner_status (known baseline leaves are expected)"
        run_dir=$(sed -n 's/^run_dir=//p' "$RUNNER_TEMP/frigolite-race/harness.log" | tail -n 1)
        tools/check_harness_leaves.sh "$run_dir"

    - name: Test coverage (sharded)
      env:
        FRIGOLITE_SHARD_TIMEOUT: 120m
        FRIGOLITE_SHARD_PARALLEL: 6
      run: tools/run_coverage_gate.sh

  profile-full-suite:
    name: Profile Full Go Test Suite
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GO_TEST_TIMEOUT: 60m
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Run and summarize full suite
      run: tools/profile-go-test.sh artifacts/go-test-profile.jsonl

    - name: Upload full-suite test events
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: go-test-profile-${{ github.run_id }}
        path: artifacts/go-test-profile.jsonl
        if-no-files-found: warn
        retention-days: 14

  build-cli:
    name: Build CLI Binaries
    runs-on: ubuntu-latest
    needs: quality-and-test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
      run: |
        mkdir -p build
        ext=""
        if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
        cd cmd/frigolite
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -ldflags="-s -w" \
          -o "../../build/frigolite-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" .
        ls -lh "../../build/frigolite-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: frigolite-${{ matrix.goos }}-${{ matrix.goarch }}
        path: build/frigolite-${{ matrix.goos }}-${{ matrix.goarch }}*
        if-no-files-found: error

  compat-test:
    name: SQLite Compatibility
    runs-on: ubuntu-latest
    needs: [quality-and-test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Install sqlite3
      run: sudo apt-get update && sudo apt-get install -y sqlite3

    - name: Run compatibility tests
      run: go test -v -timeout 60s -run "^TestCompat" ./...

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-cli, compat-test]

    steps:
    - name: Download all built binaries
      uses: actions/download-artifact@v4
      with:
        pattern: frigolite-*
        path: build/
        merge-multiple: true

    - name: List artifacts
      run: ls -lh build/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/*
        generate_release_notes: true
